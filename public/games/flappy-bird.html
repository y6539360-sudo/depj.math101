<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Flap Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 12px;
    }
    .game-wrapper {
      position: relative;
      width: 360px;
      height: 520px;
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 5;
    }
    .hud-badge {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 20;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }
    .overlay h2 { font-size: 32px; font-weight: 800; color: #f43f5e; }
    .overlay p { font-size: 15px; color: #94a3b8; }
    button {
      background: #38bdf8;
      color: #030712;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <div class="game-wrapper" id="gameWrapper">
    <div class="hud">
      <div class="hud-badge">Score: <span id="scoreText">0</span></div>
      <div class="hud-badge">Best: <span id="bestText">0</span></div>
    </div>
    <canvas id="flappyCanvas" width="360" height="520"></canvas>
    
    <div id="startOverlay" class="overlay active">
      <h2 style="color: #38bdf8;">Sky Flap</h2>
      <p>Click, Tap, or Press Space to Flap</p>
      <button onclick="startGame()">Start Flight</button>
    </div>

    <div id="gameOverOverlay" class="overlay">
      <h2>Crashed!</h2>
      <p id="finalScoreText">Score: 0</p>
      <button onclick="startGame()">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('flappyCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const bestText = document.getElementById('bestText');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreText = document.getElementById('finalScoreText');

    let bestScore = parseInt(localStorage.getItem('arcade_flappy_best') || '0', 10);
    bestText.textContent = bestScore;

    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let bird = { x: 70, y: 220, radius: 14, vy: 0, gravity: 0.38, jump: -6.8, rotation: 0 };
    let pipes = [];
    let score = 0;
    let frame = 0;

    // Web Audio Synthesizer
    let audioCtx = null;
    function playBeep(freq, duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function flap() {
      if (gameState === 'PLAYING') {
        bird.vy = bird.jump;
        playBeep(480, 0.07);
      } else if (gameState === 'START' || gameState === 'GAMEOVER') {
        startGame();
      }
    }

    function startGame() {
      gameState = 'PLAYING';
      bird = { x: 70, y: 220, radius: 14, vy: 0, gravity: 0.38, jump: -6.8, rotation: 0 };
      pipes = [];
      score = 0;
      frame = 0;
      scoreText.textContent = '0';
      startOverlay.classList.remove('active');
      gameOverOverlay.classList.remove('active');
      playBeep(600, 0.1);
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      playBeep(180, 0.25);
      finalScoreText.textContent = 'Final Score: ' + score;
      if (score > bestScore) {
        bestScore = score;
        bestText.textContent = bestScore;
        localStorage.setItem('arcade_flappy_best', bestScore);
      }
      gameOverOverlay.classList.add('active');
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        flap();
        e.preventDefault();
      }
    });

    canvas.addEventListener('pointerdown', e => {
      flap();
      e.preventDefault();
    });

    function loop() {
      frame++;

      // Sky background gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#0c1a32');
      skyGrad.addColorStop(0.7, '#1e293b');
      skyGrad.addColorStop(1, '#0f172a');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars/Clouds
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(40 + (frame * 0.2) % 360, 60, 40, 12);
      ctx.fillRect(200 + (frame * 0.15) % 360, 110, 55, 14);

      if (gameState === 'PLAYING') {
        // Bird physics
        bird.vy += bird.gravity;
        bird.y += bird.vy;
        bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.vy * 0.1)));

        // Ceiling and ground
        if (bird.y + bird.radius >= canvas.height - 25 || bird.y - bird.radius <= 0) {
          gameOver();
        }

        // Spawn pipes
        if (frame % 95 === 0) {
          const gap = 125;
          const topHeight = Math.floor(Math.random() * (canvas.height - gap - 140)) + 40;
          pipes.push({
            x: canvas.width,
            top: topHeight,
            bottom: topHeight + gap,
            passed: false
          });
        }

        // Move pipes
        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= 2.2;

          // Check pass
          if (!p.passed && p.x + 50 < bird.x) {
            p.passed = true;
            score++;
            scoreText.textContent = score;
            playBeep(780, 0.08);
          }

          // Check collision
          const inPipeX = bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + 50;
          const inTopY = bird.y - bird.radius < p.top;
          const inBottomY = bird.y + bird.radius > p.bottom;

          if (inPipeX && (inTopY || inBottomY)) {
            gameOver();
          }

          if (p.x < -60) pipes.splice(i, 1);
        }
      }

      // Draw Pipes
      pipes.forEach(p => {
        // Top pipe
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x, 0, 50, p.top);
        ctx.fillStyle = '#059669';
        ctx.fillRect(p.x - 3, p.top - 18, 56, 18);

        // Bottom pipe
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x, p.bottom, 50, canvas.height - p.bottom);
        ctx.fillStyle = '#059669';
        ctx.fillRect(p.x - 3, p.bottom, 56, 18);
      });

      // Ground
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, canvas.height - 25, canvas.width, 25);
      ctx.fillStyle = '#059669';
      ctx.fillRect(0, canvas.height - 25, canvas.width, 4);

      // Draw Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);

      // Bird body
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#facc15';
      ctx.fill();

      // Wing
      ctx.beginPath();
      ctx.ellipse(-4, Math.sin(frame * 0.3) * 3, 7, 5, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#eab308';
      ctx.fill();

      // Eye
      ctx.beginPath();
      ctx.arc(6, -4, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(7, -4, 2, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.fill();

      // Beak
      ctx.beginPath();
      ctx.moveTo(11, -1);
      ctx.lineTo(19, 3);
      ctx.lineTo(11, 7);
      ctx.fillStyle = '#f97316';
      ctx.fill();

      ctx.restore();

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
