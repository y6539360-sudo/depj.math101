<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Grid Master</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .wrapper {
      background: #131b2e;
      border: 2px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 440px;
      width: 100%;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 12px;
    }
    .title { font-size: 18px; font-weight: 800; color: #38bdf8; }
    .timer { font-size: 15px; font-weight: 700; color: #94a3b8; font-variant-numeric: tabular-nums; }
    .grid {
      display: grid;
      grid-template-columns: repeat(9, 38px);
      grid-template-rows: repeat(9, 38px);
      gap: 1px;
      background: #334155;
      padding: 2px;
      border: 3px solid #64748b;
      border-radius: 6px;
    }
    .cell {
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      cursor: pointer;
      position: relative;
    }
    .cell.given { color: #f8fafc; font-weight: 800; background: #131b2e; }
    .cell.selected { background: #1e3a8a !important; }
    .cell.highlighted { background: #172554; }
    .cell.error { background: #450a0a !important; color: #f87171 !important; }
    /* 3x3 block borders */
    .cell:nth-child(3n) { border-right: 2px solid #64748b; }
    .cell:nth-child(9n) { border-right: none; }
    .border-bottom { border-bottom: 2px solid #64748b; }

    .keypad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      margin-top: 14px;
    }
    .k-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 10px 0;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .k-btn:hover { background: #334155; border-color: #38bdf8; }
    .actions {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 12px;
      gap: 8px;
    }
    .act-btn {
      flex: 1;
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #1e293b;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .act-btn:hover { background: #1e293b; color: #f8fafc; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header-bar">
      <div class="title">Sudoku Master</div>
      <div class="timer" id="timer">00:00</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="keypad">
      <button class="k-btn" onclick="inputNumber(1)">1</button>
      <button class="k-btn" onclick="inputNumber(2)">2</button>
      <button class="k-btn" onclick="inputNumber(3)">3</button>
      <button class="k-btn" onclick="inputNumber(4)">4</button>
      <button class="k-btn" onclick="inputNumber(5)">5</button>
      <button class="k-btn" onclick="inputNumber(6)">6</button>
      <button class="k-btn" onclick="inputNumber(7)">7</button>
      <button class="k-btn" onclick="inputNumber(8)">8</button>
      <button class="k-btn" onclick="inputNumber(9)">9</button>
      <button class="k-btn" onclick="inputNumber(0)" style="color:#ef4444;">⌫</button>
    </div>

    <div class="actions">
      <button class="act-btn" onclick="newPuzzle('easy')">Easy</button>
      <button class="act-btn" onclick="newPuzzle('medium')">Medium</button>
      <button class="act-btn" onclick="newPuzzle('hard')">Hard</button>
      <button class="act-btn" onclick="checkPuzzle()">Check</button>
    </div>
  </div>

  <script>
    const gridEl = document.getElementById('grid');
    const timerEl = document.getElementById('timer');

    let solution = [
      [5,3,4,6,7,8,9,1,2],
      [6,7,2,1,9,5,3,4,8],
      [1,9,8,3,4,2,5,6,7],
      [8,5,9,7,6,1,4,2,3],
      [4,2,6,8,5,3,7,9,1],
      [7,1,3,9,2,4,8,5,6],
      [9,6,1,5,3,7,2,8,4],
      [2,8,7,4,1,9,6,3,5],
      [3,4,5,2,8,6,1,7,9]
    ];

    let board = [];
    let initial = [];
    let selectedCell = null;
    let timer = 0;
    let timerInterval = null;

    function newPuzzle(diff = 'easy') {
      clearInterval(timerInterval);
      timer = 0;
      timerInterval = setInterval(() => {
        timer++;
        const mins = String(Math.floor(timer / 60)).padStart(2, '0');
        const secs = String(timer % 60).padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
      }, 1000);

      // Create board with holes
      board = solution.map(r => [...r]);
      const holes = diff === 'easy' ? 30 : diff === 'medium' ? 44 : 52;
      let count = 0;
      while (count < holes) {
        const r = Math.floor(Math.random() * 9);
        const c = Math.floor(Math.random() * 9);
        if (board[r][c] !== 0) {
          board[r][c] = 0;
          count++;
        }
      }
      initial = board.map(r => [...r]);
      selectedCell = null;
      renderGrid();
    }

    function renderGrid() {
      gridEl.innerHTML = '';
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const val = board[r][c];
          const isGiven = initial[r][c] !== 0;
          const cell = document.createElement('div');
          cell.className = 'cell' + (isGiven ? ' given' : '');
          if (r === 2 || r === 5) cell.classList.add('border-bottom');
          cell.textContent = val !== 0 ? val : '';
          cell.dataset.r = r;
          cell.dataset.c = c;

          cell.addEventListener('click', () => selectCell(r, c));
          gridEl.appendChild(cell);
        }
      }
    }

    function selectCell(r, c) {
      selectedCell = { r, c };
      const cells = gridEl.querySelectorAll('.cell');
      const targetVal = board[r][c];

      cells.forEach(el => {
        const cr = parseInt(el.dataset.r, 10);
        const cc = parseInt(el.dataset.c, 10);
        el.classList.remove('selected', 'highlighted');
        if (cr === r && cc === c) {
          el.classList.add('selected');
        } else if (cr === r || cc === c || (Math.floor(cr / 3) === Math.floor(r / 3) && Math.floor(cc / 3) === Math.floor(c / 3))) {
          el.classList.add('highlighted');
        } else if (targetVal !== 0 && board[cr][cc] === targetVal) {
          el.classList.add('highlighted');
        }
      });
    }

    function inputNumber(num) {
      if (!selectedCell) return;
      const { r, c } = selectedCell;
      if (initial[r][c] !== 0) return; // Cannot edit given cells

      board[r][c] = num;
      const cellEl = gridEl.children[r * 9 + c];
      cellEl.textContent = num !== 0 ? num : '';
      cellEl.classList.remove('error');
    }

    function checkPuzzle() {
      let errors = 0;
      let filled = 0;
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const val = board[r][c];
          const cellEl = gridEl.children[r * 9 + c];
          if (val !== 0) {
            filled++;
            if (val !== solution[r][c]) {
              cellEl.classList.add('error');
              errors++;
            } else {
              cellEl.classList.remove('error');
            }
          }
        }
      }
      if (filled === 81 && errors === 0) {
        clearInterval(timerInterval);
        alert('Congratulations! Puzzle solved perfectly!');
      } else if (errors === 0) {
        alert('So far so good! No errors found.');
      } else {
        alert(`Found ${errors} misplaced number(s).`);
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key >= '1' && e.key <= '9') inputNumber(parseInt(e.key, 10));
      if (e.key === 'Backspace' || e.key === 'Delete') inputNumber(0);
      if (selectedCell) {
        if (e.key === 'ArrowUp' && selectedCell.r > 0) selectCell(selectedCell.r - 1, selectedCell.c);
        if (e.key === 'ArrowDown' && selectedCell.r < 8) selectCell(selectedCell.r + 1, selectedCell.c);
        if (e.key === 'ArrowLeft' && selectedCell.c > 0) selectCell(selectedCell.r, selectedCell.c - 1);
        if (e.key === 'ArrowRight' && selectedCell.c < 8) selectCell(selectedCell.r, selectedCell.c + 1);
      }
    });

    newPuzzle('easy');
  </script>
</body>
</html>
